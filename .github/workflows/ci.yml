name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows / Rust + frontend
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check formatting
        working-directory: ramscope
        run: cargo fmt --check

      - name: Run tests
        working-directory: ramscope
        run: cargo test

      - name: Run clippy
        working-directory: ramscope
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        working-directory: ramscope
        run: cargo build --release

      - name: Check frontend JavaScript
        run: node --check ramscope/src/web/app.js

      - name: Verify evidence checksums
        run: sha256sum -c docs/evidence/SHA256SUMS

      - name: Refuse generated or untracked files
        run: |
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf 'Untracked files:\n%s\n' "$untracked"
            exit 1
          fi
